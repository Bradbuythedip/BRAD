version: '3.8'

services:
  ouroboros-bot:
    build: .
    container_name: ouroboros-bot
    restart: unless-stopped

    volumes:
      - ./bot/config.json:/app/bot/config.json:ro
      - ./bot/tweet_history.jsonl:/app/bot/tweet_history.jsonl

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
